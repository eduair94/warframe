name: CI / Deploy

# Push to main  -> run gates, then deploy to the pm2 prod server over SSH.
# Pull requests -> run gates only (no deploy).
# See docs/superpowers/specs/2026-07-15-cicd-github-actions-design.md
on:
  push:
    branches: [main]
  pull_request:

# Serialize per ref: main runs QUEUE (never two deploys at once); superseded PR
# check runs cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: Gates (lint / typecheck / unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - name: Install API deps
        run: npm ci

      - name: Install app deps
        run: npm ci
        working-directory: app

      # --- Gates ---
      # Style/static-analysis gates are ADVISORY (continue-on-error): they run
      # and annotate the run, but do not block deploy while pre-existing lint /
      # format / type debt is cleaned up incrementally. Unit tests are the one
      # BLOCKING gate — a failure here fails the job and stops the deploy.
      - name: Lint (API) [advisory]
        run: npm run lint
        continue-on-error: true

      - name: Format check (API) [advisory]
        run: npm run format:check
        continue-on-error: true

      - name: Typecheck (app) [advisory]
        run: npm run typecheck
        working-directory: app
        continue-on-error: true

      - name: Lint (app) [advisory]
        run: npm run lint
        working-directory: app
        continue-on-error: true

      # BLOCKING — must pass for the deploy to run.
      - name: Unit tests (API)
        run: npm run test:unit

      # BLOCKING — vue-i18n must compile every message. A literal @ (linked-msg
      # marker), unescaped {, or {{double-brace}} crashes the page in the prod
      # build (this exact class blanked /endo). Escape specials: @ -> {'@'}.
      - name: i18n messages compile (app)
        run: npm run i18n:check
        working-directory: app

      # BLOCKING — docs/repo-map.md is generated from source (routes, endpoints,
      # services, i18n sizes). If a route/endpoint was added without regenerating,
      # the AI-facing map is a lie. Run `npm run repo:index` and commit the result.
      - name: Repo map up to date (API)
        run: npm run repo:index:check

  deploy:
    name: Deploy to prod (pm2)
    needs: ci
    # Dormant until you ARM it: set repo variable DEPLOY_ENABLED=true (after the
    # SSH secrets are in place). Lets the workflow land + run CI without firing a
    # deploy that would fail for missing secrets.
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      # Fail fast and legibly when the box itself is gone. Without this the run
      # dies on a bare "connect timeout" from the SSH action, which reads like a
      # credentials problem and sends you looking in the wrong place — that is
      # exactly what a host-level outage looks like from CI. See
      # docs/runbook-outage.md.
      - name: Preflight — prod host reachable
        run: |
          set -uo pipefail
          HOST="${{ secrets.SSH_HOST }}"
          PORT="${{ secrets.SSH_PORT || 22 }}"
          if timeout 15 bash -c "cat < /dev/null > /dev/tcp/${HOST}/${PORT}" 2>/dev/null; then
            echo "prod host reachable on ${PORT}"
          else
            echo "::error::Prod host is not reachable on port ${PORT}. The box is down, not the deploy. Follow docs/runbook-outage.md (check the InterServer control panel for a powered-off VM, node maintenance, or a suspended account)."
            exit 1
          fi

      - name: SSH deploy (pull -> build -> pm2 reload)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          # Abort on the first failing command, so a failed build never reaches
          # `pm2 reload` and prod keeps serving the previous build.
          script_stop: true
          script: |
            set -e
            # The server's root user defaults to node 22 via nvm; the Nuxt build
            # (and the npm-11 lockfile) need node 24 / npm 11, which live in
            # /usr/local/bin. Prepend it so node/npm/pm2 all resolve to 24.
            export PATH=/usr/local/bin:$PATH
            # The app (Nuxt) build now bundles the localized SEO overlay plus a
            # few hundred per-locale guide/faq/creators content JSON chunks. That
            # pushed the build past node's default heap (auto-sized to the box,
            # ~2 GB) → "JavaScript heap out of memory" mid-build. Give the build
            # headroom so `npm run build` (app) completes before pm2 reload.
            export NODE_OPTIONS="--max-old-space-size=4096"
            node -v
            cd "${{ secrets.DEPLOY_PATH }}"
            git pull --ff-only
            npm ci
            npm run build
            cd app
            npm ci
            npm run build
            cd ..
            pm2 reload ecosystem.config.js --update-env
            # `pm2 reload` only touches already-running apps, so a NEWLY added
            # ecosystem entry (e.g. warframe-sync-translations) is never picked
            # up. Explicitly start/re-run just that one-shot sync so the i18n
            # dictionaries are registered and populated on deploy (it's light and
            # autorestart:false, so it runs once and exits; the daily cron takes
            # over after). --only keeps this from re-triggering the heavy syncs
            # (items/rivens/drops) that `reload` intentionally leaves stopped.
            pm2 start ecosystem.config.js --only warframe-sync-translations --update-env || true
            # Same reasoning for the Foundry catalogue (mastery/build checklist):
            # a newly added entry needs one explicit start, and /foundry is empty
            # until that first run populates the warframe-foundry collection.
            pm2 start ecosystem.config.js --only warframe-sync-foundry --update-env || true
            # Targeted set-roster heal (one-shot, autorestart:false). Fixes any
            # set whose items_in_set roster was never populated — e.g. a Prime
            # enriched before warframe.market published its setParts, which makes
            # /set_full 500 "Not a set". Runs here where the proxy-capable sync
            # client can reach warframe.market's throttled /v2/items catalogue
            # (the API server process cannot). See sync_repair_sets.ts.
            pm2 start ecosystem.config.js --only warframe-sync-repair-sets --update-env || true
            # `pm2 save` writes the running process list to /root/.pm2/dump.pm2,
            # which is what the pm2 systemd unit replays on boot. Without it a
            # reboot brings pm2 up with NO apps. Not optional — see
            # scripts/prod-bootstrap.sh, which arms the rest of the boot chain.
            pm2 save || true

            # Smoke test from ON the box, before we call the deploy good. pm2
            # reload returning 0 only means the process started, not that it can
            # serve: a bad build, a missing env var or a dead mongo all produce a
            # "successful" deploy that serves errors. /health is uncached, so a
            # 200 here is this build answering right now.
            echo "Smoke test: waiting for the API to answer /health"
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null --max-time 10 -w '%{http_code}' "http://127.0.0.1:${API_PORT:-3529}/health" || true)
              body=$(curl -s --max-time 10 "http://127.0.0.1:${API_PORT:-3529}/health" || true)
              if [ "$code" = "200" ] && echo "$body" | grep -q '"ok":true'; then
                echo "API healthy after ${i} attempt(s): $body"
                break
              fi
              if [ "$i" = "30" ]; then
                echo "API did not become healthy (last code=${code} body=${body})" >&2
                pm2 logs warframe-server --lines 40 --nostream || true
                exit 1
              fi
              sleep 5
            done

            # Same for the Nuxt frontend: a broken SSR bundle boots fine and then
            # 500s on the first request.
            app_code=$(curl -s -o /dev/null --max-time 25 -w '%{http_code}' "http://127.0.0.1:3312/" || true)
            if [ "$app_code" != "200" ]; then
              echo "Frontend returned ${app_code} after deploy" >&2
              pm2 logs warframe-app --lines 40 --nostream || true
              exit 1
            fi
            echo "Frontend healthy (200)"

      # Public-edge check, run from GitHub rather than from the box: proves the
      # tunnel and Cloudflare are actually carrying the new build to visitors.
      # Advisory — the deploy itself already passed its on-box smoke test, and
      # failing the run for an edge-propagation lag would be misleading. The
      # uptime monitor is the thing that alarms on a sustained public outage.
      - name: Public reachability check [advisory]
        continue-on-error: true
        run: |
          set -uo pipefail
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null --max-time 25 -w '%{http_code}' https://warframe.digitalshopuy.com/health || true)
            if [ "$code" = "200" ]; then echo "public /health -> 200"; exit 0; fi
            echo "attempt ${i}: public /health -> ${code}"
            sleep 15
          done
          echo "::warning::Deploy succeeded on the box but the public endpoint is not answering — check the Cloudflare Tunnel."
          exit 1
